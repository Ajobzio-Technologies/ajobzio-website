<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        // Get the current path without .html extension
        const path = window.location.pathname;
        const cleanPath = path.replace(/\.html$/, '').replace(/\/$/, '') || '/';

        // Map clean URLs to actual HTML files
        const urlMap = {
            '/careers': '/careers.html',
            '/support': '/support.html',
            '/privacy': '/privacy.html',
            '/terms': '/terms.html',
            '/': '/index.html'
        };

        // Redirect to the correct HTML file
        const targetPath = urlMap[cleanPath] || urlMap['/'];
        if (path !== targetPath) {
            window.location.replace(targetPath);
        }
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
